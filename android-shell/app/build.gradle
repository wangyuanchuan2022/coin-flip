apply plugin: 'com.android.application'

android {
    namespace 'io.github.wangyuanchuan2022.twa'
    compileSdkVersion 36
    defaultConfig {
        applicationId "io.github.wangyuanchuan2022.twa"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 2
        versionName "2.0-full"
    }
    signingConfigs {
        release {
            def ksFile = project.findProperty('ksFile')
            def ksPass = project.findProperty('ksPass')
            def keyPass = project.findProperty('keyPass')
            if (ksFile == null || ksPass == null || keyPass == null) {
                throw new GradleException('缺少签名属性：需要 -PksFile -PksPass -PkeyPass（build-apk.ps1 自动携带）')
            }
            storeFile file(ksFile)
            if (!storeFile.exists()) {
                throw new GradleException('keystore 不存在: ' + storeFile)
            }
            storePassword ksPass
            keyAlias 'android'
            keyPassword keyPass
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
